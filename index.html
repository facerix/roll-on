<!doctype html>

<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Roll On</title>
    <meta charset="utf-8" />
    <meta name="description" content="An experimental 18-wheeler driving game" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c2e" />
    <link rel="canonical" href="https://roll-on.facerix.com/" />
    <meta property="og:title" content="Roll On" />
    <meta property="og:description" content="An experimental 18-wheeler driving game" />
    <meta property="og:url" content="https://roll-on.facerix.com/" />
    <meta property="og:type" content="website" />
    <meta http-equiv="Content-Language" content="en" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="/fonts/bigsquaredots/stylesheet.css" />
    <link rel="stylesheet" href="/fonts/DSEG7/stylesheet.css" />
    <link rel="stylesheet" href="/main.css" type="text/css" charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="modulepreload" href="/index.js" />

    <style>
      body {
        overflow: hidden;
      }

      #title-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        min-height: 100vh;
        padding: 0 0 15vh;
        background: #000 url('/images/title.jpg') center / contain no-repeat;
        image-rendering: pixelated;
        cursor: pointer;
      }

      #start-hint {
        font-family: 'BigSquareDots', 'Courier New', Courier, monospace;
        font-size: 4.5rem;
        letter-spacing: 0.25em;
        text-align: center;
        text-transform: uppercase;
        color: #e88a2a;
        text-shadow: 0 0 8px rgba(232, 138, 42, 0.6);
        margin: 0;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      #main-foot {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: transparent;
        border-top: none;
        color: #666;
        font-size: 0.75rem;
        z-index: 1;

        font-family: 'BigSquareDots', 'Courier New', Courier, monospace;
      }

      #main-foot a {
        color: #888;
      }
    </style>
  </head>

  <body class="u-fill-height">
    <!-- Title Screen -->
    <main id="title-screen" role="button" tabindex="0" aria-label="Start game">
      <p id="start-hint">Press Start</p>
    </main>

    <footer id="main-foot"><a href="/about.html">GAME INFO</a></footer>

    <update-notification></update-notification>
  </body>
  <script src="/index.js" type="module"></script>
</html>
